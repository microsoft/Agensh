# Software project: improve an existing repository, or build a new one, from a
# goal in the project file (.agensh/project.toml); delivered as an upstream PR.
name = "software-project"
description = "Work on a real repository from a goal; deliver main upstream as a pull request"

[hooks]
prepare = "hooks/prepare.py"    # import upstream history (or start empty), render prompts
sync = "hooks/sync.py"          # merge the upstream base branch into main (or open a conflict issue)
export = "hooks/export.py"      # push main to a delivery branch and open a pull request
evaluate = "hooks/evaluate.py"  # run the full acceptance suite on the delivered main

[messages]
task_brief = "prompts/task_brief.txt"
idle = "prompts/idle.txt"
idle_delivery = "prompts/idle_delivery.txt"

[team]
issue_title = "{task}: project goal"
board_id = "team"
channel = "team-task"
wake_stagger = "5s"      # 4-16 workers start within a minute or two
event_context = "inline" # events carry the latest comment or the thread's start

[environment]
network = "auto"         # open for a public GitHub upstream, allowlist otherwise; a project may choose
task_prompts = "run"     # the prepare hook renders templates/ for each project
model_route = true       # AGENSH_MODEL_BASE for the project's own model calls (unmodified, metered)

[workspace]
import_history = true    # the upstream branch's history becomes the team's main

[acceptance]
ci_gate = true           # PRs merge after the generated workflow passes; see agensh/quality.py
# The workflow and project file need the administrator; a project file may add paths.
protected_paths = [".gitea/workflows/**", ".agensh/**"]

[coordination]
backlog = "issues"       # a CLAIM citing #<n> assigns issue n to its author while the claim lives

[lifecycle]
sync_before_end = "30m"  # sync upstream this long before the end, so conflicts can be resolved; again before export
resumable = true         # the token budget or `agensh.project pause` pauses; `resume` continues with fresh sessions
stop_when = ["budget", "tokens", "issue_closed"]
finalize_notice = "15m"  # tell workers to wrap up this long before a timed finalize
evaluate_with_services = true  # the final commands may call models through AGENSH_MODEL_BASE

[human]
product_owner = true     # a project file may add [human] mode = "optional" with a username
