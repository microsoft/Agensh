# Standalone baseline: one selected harness and a model proxy, without team services.
# launch_single_agent.py supplies unique mounts, subnets, images and model credentials.
services:
  egress-proxy:
    image: python:3.13-slim
    init: true
    cgroup_parent: pbench.slice
    mem_limit: 1g
    memswap_limit: 1g
    networks: [default, egress]
    env_file: ["${MODEL_ENV_FILE:?}"]
    environment:
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: "4180"
      PYTHONUNBUFFERED: "1"
      UPSTREAM_DISABLED_TOOLS: functions.request_user_input,functions.request_user_input_async,request_user_input,request_user_input_async
      UPSTREAM_CODE_MODE_OUTPUT_TOKENS: "${TOOL_OUTPUT_BYTES:-1048576}"
      UPSTREAM_MAX_OUTPUT_TOKENS: "${OUTPUT_TOKENS:-0}"
      UPSTREAM_TOOL_OUTPUT_BYTES: "${TOOL_OUTPUT_BYTES:-1048576}"
      UPSTREAM_AGENT_HARNESS: "${AGENT_HARNESS:-copilot}"
      UPSTREAM_ANTHROPIC_MODEL: "${LLM_MODEL:-gpt-5.6-sol}"
      UPSTREAM_ANTHROPIC_EFFORT: "${REASONING_EFFORT:-high}"
      UPSTREAM_RESPONSE_VERBOSITY: low
      UPSTREAM_REQUEST_TIMEOUT_SECONDS: "600"
    volumes:
      - ../scripts/strip_metadata_proxy.py:/opt/strip_metadata_proxy.py:ro
      - ../scripts/code_mode_limits.py:/opt/code_mode_limits.py:ro
    command: [python3, /opt/strip_metadata_proxy.py]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4180/healthz',timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 30

  cc-agent:
    # The root bridge supervises a non-root ACP child and seals its persistent state.
    image: "${SINGLE_AGENT_IMAGE:?}"
    init: true
    user: "0:0"
    working_dir: /workspace
    cgroup_parent: pbench.slice
    mem_limit: 64g
    memswap_limit: 64g
    stop_grace_period: 600s
    networks: [default]
    depends_on:
      egress-proxy:
        condition: service_healthy
    environment:
      AGENT_HARNESS: "${AGENT_HARNESS:-copilot}"
      AGENT_HOME: /opt/data
      ACP_CHILD_UID: "10000"
      ACP_CHILD_GID: "10000"
      HOME: /home/ccagent
      ANTHROPIC_BASE_URL: http://egress-proxy:4180/v1
      ANTHROPIC_API_KEY: local-proxy-no-auth
      ANTHROPIC_MODEL: "${LLM_MODEL:-gpt-5.6-sol}"
      HARNESS_VERSION: "${HARNESS_VERSION:-}"
      REASONING_EFFORT: "${REASONING_EFFORT:-high}"
      PROMPT_TOKENS: "${PROMPT_TOKENS:-272000}"
      OUTPUT_TOKENS: "${OUTPUT_TOKENS:-0}"
      TOOL_OUTPUT_BYTES: "${TOOL_OUTPUT_BYTES:-1048576}"
      COMPACT_FRACTION: "${COMPACT_FRACTION-0.8}"
    volumes:
      - "${WORKSPACE_DIR:?}:/workspace"
      # The archive bridge saves /work; both names refer to the same workspace.
      - "${WORKSPACE_DIR:?}:/work"
      - "${REFERENCE_BIN:?}:/opt/pbench/executable:ro"
      - "${STATE_DIR:?}:/opt/data"
      - "${HOME_DIR:?}:/home/ccagent"
      - ../scripts/single_agent_stdio.py:/opt/single_agent_stdio.py:ro
      - ../agent/entrypoint.sh:/opt/omcgitea/entrypoint.sh:ro
    entrypoint: [bash, /opt/omcgitea/entrypoint.sh, standalone]
    healthcheck:
      test: [CMD, python3, -c, "from pathlib import Path; assert Path('/opt/data/acp.sock').is_socket()"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  default:
    internal: true
    ipam:
      config:
        - subnet: "${SUBNET_DEFAULT:?}"
  egress:
    ipam:
      config:
        - subnet: "${SUBNET_EGRESS:?}"
