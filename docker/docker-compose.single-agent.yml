# Standalone baseline: one Copilot worker and one model proxy, without team services.
# launch_single_agent.py supplies unique mounts, subnets, images and model credentials.
services:
  egress-proxy:
    image: python:3.13-slim
    init: true
    cgroup_parent: pbench.slice
    mem_limit: 1g
    memswap_limit: 1g
    networks: [default, egress]
    env_file: ["${MODEL_ENV_FILE:?}"]
    environment:
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: "4180"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../scripts/strip_metadata_proxy.py:/opt/strip_metadata_proxy.py:ro
    command: [python3, /opt/strip_metadata_proxy.py]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4180/healthz',timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 30

  cc-agent:
    # The root bridge supervises a non-root ACP child and seals its persistent state.
    image: "${SINGLE_AGENT_IMAGE:?}"
    init: true
    user: "0:0"
    working_dir: /workspace
    cgroup_parent: pbench.slice
    mem_limit: 64g
    memswap_limit: 64g
    stop_grace_period: 600s
    networks: [default]
    depends_on:
      egress-proxy:
        condition: service_healthy
    environment:
      AGENT_HOME: /opt/data
      ACP_CHILD_UID: "10000"
      ACP_CHILD_GID: "10000"
      HOME: /home/ccagent
      COPILOT_HOME: /home/ccagent/.copilot
      COPILOT_PROVIDER_TYPE: openai
      COPILOT_PROVIDER_BASE_URL: http://egress-proxy:4180/v1
      COPILOT_PROVIDER_API_KEY: local-proxy-no-auth
      OPENAI_API_KEY: local-proxy-no-auth
      COPILOT_MODEL: gpt-5.6-sol
      COPILOT_PROVIDER_WIRE_API: responses
      COPILOT_PROVIDER_MAX_PROMPT_TOKENS: "272000"
      COPILOT_AGENT_REASONING_EFFORT: high
      COPILOT_LARGE_OUTPUT_THRESHOLD_BYTES: "1048576"
      COPILOT_OFFLINE: "true"
      COPILOT_AUTO_UPDATE: "false"
      COPILOT_ENABLE_ALT_PROVIDERS: "true"
    volumes:
      - "${WORKSPACE_DIR:?}:/workspace"
      # The archive bridge saves /work; both names refer to the same workspace.
      - "${WORKSPACE_DIR:?}:/work"
      - "${REFERENCE_BIN:?}:/opt/pbench/executable:ro"
      - "${STATE_DIR:?}:/opt/data"
      - "${HOME_DIR:?}:/home/ccagent"
      - ../scripts/single_agent_stdio.py:/opt/single_agent_stdio.py:ro
    entrypoint:
      - python3
      - /opt/omcgitea/acp-bridge.py
      - /opt/data/acp.sock
      - "10000"
      - "10000"
      - --
      - /usr/local/bin/copilot-wrapped
      - --excluded-tools=task
      - --excluded-tools=list_agents
      - --acp
      - --stdio
      - --no-auto-login
      - --no-auto-update
      - --no-remote
      - --disable-builtin-mcps
      - --no-ask-user
      - --effort
      - high
    healthcheck:
      test: [CMD, python3, -c, "from pathlib import Path; assert Path('/opt/data/acp.sock').is_socket()"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  default:
    internal: true
    ipam:
      config:
        - subnet: "${SUBNET_DEFAULT:?}"
  egress:
    ipam:
      config:
        - subnet: "${SUBNET_EGRESS:?}"
