        condition: service_healthy
      hermes-agent-director:
        condition: service_started
    environment:
      <<: *mini-router-env-base
      AGENT_NAME: "${ORG_NAME}-director"
      GITEA_PASSWORD_FILE: "/run/omcgitea/tokens/agent-${ORG_NAME}-director.password"
    volumes:
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/acp/${ORG_NAME}-director:/var/run/acp:ro
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/tokens/agent-${ORG_NAME}-director.password:/run/omcgitea/tokens/agent-${ORG_NAME}-director.password:ro
    expose: ["8645"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8645/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
