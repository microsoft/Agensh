# omcgitea — fleet template for prod-style deployments (1 instance/profile).
#
# Single command per instance (Makefile auto-selects this file when
# PROFILE matches `org-*`):
#     make up PROFILE=org-foo        # reads .env.org-foo
#     make up PROFILE=org-bar        # reads .env.org-bar
#
# What this template fixes:
#   - 37 agents per instance (1 director + 1 auditor + 5 leads +
#     5 reviewers + 25 workers; mirrors prod2's real topology)
#   - Stable software defaults (model, beta, cache TTL, agent_kind, ...)
#   - Image tags (omcgitea-hermes-agent:local, omcgitea-mini-router:local)
#
# What every instance must vary (.env.<profile>):
#   - ORG_NAME     (becomes prefix for all 37 agent names + gitea org)
#   - PORT_BASE    (host port base for gitea/mm edge; instances offset
#                   by +10 are safe to co-locate)
#   - DATA_ROOT    (host bind-mount root, default ../.claude-team-data)
#   - 5 secrets:   GITEA_ADMIN_PASSWORD / MATTERMOST_ADMIN_PASSWORD /
#                   MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD /
#                   SECRET_SERVICE_INTERNAL_AUTH (+ ANTHROPIC_API_KEY)
#
# AUTOGENERATED by tools/gen-compose-prod.py — edit the script, not this
# file. The agent topology is intentionally hard-coded; if you need a
# different topology, copy this file (e.g. docker-compose.prod-small.yml)
# and adjust tools/gen-compose-prod.py to emit the new shape.

# `name:` becomes the docker compose project name; Makefile overrides it
# to omcgitea-${PROFILE} via --project-name so multi-instance on one host
# stays isolated (separate networks, separate container names).
name: omcgitea

# ---------------------------------------------------------------------------
# Anchors — same shape as docker-compose.yml's. Claude remains the default;
# AGENT_KIND=copilot and its five explicit capability/profile values are
# opt-in deployment inputs read from .env.<profile>.
# ---------------------------------------------------------------------------
x-hermes-agent: &hermes-agent-base
  image: "${AGENT_IMAGE:-omcgitea-hermes-agent:local}"
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-hermes-env: &hermes-env-base
  GITEA_HOST: "http://gitea:3000"
  ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:?ANTHROPIC_BASE_URL required}"
  ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-opus-4.8[1m]}"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY required}"
  HERMES_UID: "10000"
  AGENT_KIND: "${AGENT_KIND:-claude}"
  COPILOT_PROVIDER_TYPE: "${COPILOT_PROVIDER_TYPE:-openai}"
  ENABLE_TOOL_SEARCH: "true"
  CLAUDE_CODE_ATTRIBUTION_HEADER: "0"
  ENABLE_PROMPT_CACHING_1H: "1"
  GITEA_ORG: "${ORG_NAME:?ORG_NAME required}"
  MATTERMOST_HOST: "http://mattermost:8065"
  # pbench bin anti-reverse (opt-in, empty default → no effect on dev/prod/org-*):
  # when .env.<profile> sets ACP_CHILD_UID, acp-bridge.py spawns the ACP
  # child (claude-agent-acp) as that non-root uid, so a root:root 0111
  # reference binary can be executed but not read. Only .env.org-pbench
  # sets these; every other profile leaves them empty → child stays root.
  ACP_CHILD_UID: "${ACP_CHILD_UID:-}"
  ACP_CHILD_GID: "${ACP_CHILD_GID:-}"

x-mini-router: &mini-router-base
  image: "omcgitea-mini-router:local"
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-mini-router-env: &mini-router-env-base
  GITEA_HOST: "http://gitea:3000"
  MYSQL_DSN: "mysql://omcgitea:${MYSQL_PASSWORD}@mysql:3306/omcgitea"
  SECRET_SERVICE_URL: "http://secret-service:8650"
  SECRET_SERVICE_INTERNAL_AUTH: "${SECRET_SERVICE_INTERNAL_AUTH}"
  ACP_SOCKET_PATH: "/var/run/acp/agent.sock"
  ACP_SESSION_NAMESPACE: "${AGENT_KIND:-claude}"
  METRICS_PORT: "8645"
  MATTERMOST_HOST: "http://mattermost:8065"
  MINI_ROUTER_STUCK_MS: "${MINI_ROUTER_STUCK_MS:-1200000}"
  # DeLM shared context. Empty by default → BoardClient.enabled is false in
  # the router and dispatch is byte-for-byte the pre-board behavior. The
  # board-running profiles set these in .env.<profile>, which is what turns
  # forced read (board spliced into every prompt) + forced write (nudge on a
  # turn that published nothing) on. Per-agent BOARD_IDS overrides for the
  # hierarchical topology are applied in the compose overlays.
  BOARD_SERVICE_URL: "${BOARD_SERVICE_URL:-}"
  BOARD_IDS: "${BOARD_IDS:-}"
  BOARD_WINDOW_TOKENS: "${BOARD_WINDOW_TOKENS:-}"
  BOARD_MODE: "${BOARD_MODE:-batch}"
  BOARD_RENDER_MODE: "${BOARD_RENDER_MODE:-}"
  BOARD_ROLE: "${BOARD_ROLE:-}"
  STEP_LOOP_NO_PROGRESS_LIMIT: "${STEP_LOOP_NO_PROGRESS_LIMIT:-}"
  STEP_LOOP_STRATEGY_PRIOR: "${STEP_LOOP_STRATEGY_PRIOR:-}"
  STEP_LOOP_MAX_STEPS: "${STEP_LOOP_MAX_STEPS:-}"
  STEP_LOOP_HOURS: "${STEP_LOOP_HOURS:-}"
  STEP_LOOP_TASK: "${STEP_LOOP_TASK:-}"

services:
  gitea:
    image: docker.gitea.com/gitea:1.22.6
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__server__ROOT_URL: "http://gitea.${EDGE_DOMAIN:-localhost}:${EDGE_HTTP_PORT}/"
      GITEA__server__DOMAIN: "gitea.${EDGE_DOMAIN:-localhost}"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      GITEA__service__AUTO_WATCH_ON_CHANGES: "false"
      GITEA__service__AUTO_WATCH_NEW_REPOS: "false"
      GITEA__actions__ENABLED: "true"
      GITEA__actions__DEFAULT_ACTIONS_URL: "github"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__log__LEVEL: Info
      GITEA_ADMIN_USER: "${GITEA_ADMIN_USER:-chairman}"
      GITEA_ADMIN_PASSWORD: "${GITEA_ADMIN_PASSWORD:?GITEA_ADMIN_PASSWORD required}"
      GITEA_ADMIN_EMAIL: "chairman@${ORG_NAME}.local"
    volumes:
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/gitea:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/v1/version || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  nginx-edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    ports:
      - "${EDGE_HTTP_PORT}:80"
      - "${EDGE_MM_PORT}:81"
    volumes:
      - ./nginx-edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-edge/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Host: gitea.localhost' http://127.0.0.1/api/v1/version >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  gitea-admin-init:
    image: docker.gitea.com/gitea:1.22.6
    restart: "no"
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      GITEA_ADMIN_USER: "${GITEA_ADMIN_USER:-chairman}"
      GITEA_ADMIN_PASSWORD: "${GITEA_ADMIN_PASSWORD}"
      GITEA_ADMIN_EMAIL: "chairman@${ORG_NAME}.local"
    user: "1000:1000"
    volumes:
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/gitea:/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        cfg=/data/gitea/conf/app.ini
        export GITEA_WORK_DIR=/data/gitea
        export GITEA_CUSTOM=/data/gitea
        if gitea --config "$$cfg" admin user list 2>/dev/null | awk 'NR>1 {print $$2}' | grep -qx "$$GITEA_ADMIN_USER"; then
          echo "[admin-init] admin user $$GITEA_ADMIN_USER already exists"; exit 0;
        fi
        echo "[admin-init] creating admin user $$GITEA_ADMIN_USER";
        gitea --config "$$cfg" admin user create \
          --username "$$GITEA_ADMIN_USER" --password "$$GITEA_ADMIN_PASSWORD" \
          --email "$$GITEA_ADMIN_EMAIL" --admin --must-change-password=false

  bootstrap:
    build:
      context: ./bootstrap
    image: omcgitea-bootstrap:local
    restart: "no"
    depends_on:
      gitea: { condition: service_healthy }
      gitea-admin-init: { condition: service_completed_successfully }
      mattermost: { condition: service_healthy }
    environment:
      GITEA_HOST: "http://gitea:3000"
      GITEA_ADMIN_USER: "${GITEA_ADMIN_USER:-chairman}"
      GITEA_ADMIN_PASSWORD: "${GITEA_ADMIN_PASSWORD}"
      GITEA_ADMIN_EMAIL: "chairman@${ORG_NAME}.local"
      # Bootstrap creates the Gitea org with this name. Without it the
      # bootstrap script falls back to its built-in default ("omcgitea")
      # and the org won't match the agents' GITEA_ORG env, breaking the
      # team API queries the agents do at runtime.
      GITEA_ORG: "${ORG_NAME:?ORG_NAME required}"
      # AGENTS / ROLES derived from the fixed 37-agent topology baked into
      # this compose file. ${ORG_NAME} prefixes every name so two instances
      # on the same host don't share Gitea users.
      AGENTS: "${ORG_NAME}-director,${ORG_NAME}-auditor,${ORG_NAME}-team1-lead,${ORG_NAME}-team1-reviewer,${ORG_NAME}-team1-worker1,${ORG_NAME}-team1-worker2,${ORG_NAME}-team1-worker3,${ORG_NAME}-team1-worker4,${ORG_NAME}-team1-worker5,${ORG_NAME}-team2-lead,${ORG_NAME}-team2-reviewer,${ORG_NAME}-team2-worker1,${ORG_NAME}-team2-worker2,${ORG_NAME}-team2-worker3,${ORG_NAME}-team2-worker4,${ORG_NAME}-team2-worker5,${ORG_NAME}-team3-lead,${ORG_NAME}-team3-reviewer,${ORG_NAME}-team3-worker1,${ORG_NAME}-team3-worker2,${ORG_NAME}-team3-worker3,${ORG_NAME}-team3-worker4,${ORG_NAME}-team3-worker5,${ORG_NAME}-team4-lead,${ORG_NAME}-team4-reviewer,${ORG_NAME}-team4-worker1,${ORG_NAME}-team4-worker2,${ORG_NAME}-team4-worker3,${ORG_NAME}-team4-worker4,${ORG_NAME}-team4-worker5,${ORG_NAME}-team5-lead,${ORG_NAME}-team5-reviewer,${ORG_NAME}-team5-worker1,${ORG_NAME}-team5-worker2,${ORG_NAME}-team5-worker3,${ORG_NAME}-team5-worker4,${ORG_NAME}-team5-worker5"
      ROLES:  "director=${ORG_NAME}-director;auditor=${ORG_NAME}-auditor;lead=${ORG_NAME}-team1-lead,${ORG_NAME}-team2-lead,${ORG_NAME}-team3-lead,${ORG_NAME}-team4-lead,${ORG_NAME}-team5-lead;reviewer=${ORG_NAME}-team1-reviewer,${ORG_NAME}-team2-reviewer,${ORG_NAME}-team3-reviewer,${ORG_NAME}-team4-reviewer,${ORG_NAME}-team5-reviewer;coder=${ORG_NAME}-team1-worker1,${ORG_NAME}-team1-worker2,${ORG_NAME}-team1-worker3,${ORG_NAME}-team1-worker4,${ORG_NAME}-team1-worker5,${ORG_NAME}-team2-worker1,${ORG_NAME}-team2-worker2,${ORG_NAME}-team2-worker3,${ORG_NAME}-team2-worker4,${ORG_NAME}-team2-worker5,${ORG_NAME}-team3-worker1,${ORG_NAME}-team3-worker2,${ORG_NAME}-team3-worker3,${ORG_NAME}-team3-worker4,${ORG_NAME}-team3-worker5,${ORG_NAME}-team4-worker1,${ORG_NAME}-team4-worker2,${ORG_NAME}-team4-worker3,${ORG_NAME}-team4-worker4,${ORG_NAME}-team4-worker5,${ORG_NAME}-team5-worker1,${ORG_NAME}-team5-worker2,${ORG_NAME}-team5-worker3,${ORG_NAME}-team5-worker4,${ORG_NAME}-team5-worker5"
      REPOS: "${REPOS:-main}"
      REQUIRED_APPROVALS: "${REQUIRED_APPROVALS:-1}"
      # R6.5 test-gate topology. PBENCH_LEAD_USER gets push rights on main so
      # the lead can publish tests/ (the spec) without gating it on itself.
      PBENCH_LEAD_USER: "${PBENCH_LEAD_USER:-}"
      # Opt-in only: a required check whose job never runs pins every PR at
      # "pending", which blocks merge forever. Prove it on one task first.
      PBENCH_REQUIRE_LEAD_TESTS: "${PBENCH_REQUIRE_LEAD_TESTS:-0}"
      BOOTSTRAP_DATA_DIR: "/data"
      MATTERMOST_HOST: "http://mattermost:8065"
      MATTERMOST_ADMIN_USER: "${MATTERMOST_ADMIN_USER:-mmadmin}"
      MATTERMOST_ADMIN_PASSWORD: "${MATTERMOST_ADMIN_PASSWORD:?MATTERMOST_ADMIN_PASSWORD required}"
      MATTERMOST_ADMIN_EMAIL: "mmadmin@${ORG_NAME}.local"
      MATTERMOST_TEAM_NAME: "${ORG_NAME}"
      MATTERMOST_TEAM_DISPLAY: "${ORG_NAME}"
    volumes:
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}:/data

  secret-service:
    build:
      context: ../secret-service
    image: omcgitea-secret-service:local
    restart: unless-stopped
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    environment:
      SECRET_SERVICE_INTERNAL_AUTH: "${SECRET_SERVICE_INTERNAL_AUTH:?SECRET_SERVICE_INTERNAL_AUTH required}"
      SECRET_SERVICE_TOKENS_DIR: /data/tokens
      SECRET_SERVICE_PORT: "8650"
    volumes:
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/tokens:/data/tokens:ro
    expose: ["8650"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8650/healthz', timeout=2).read()==b'ok\\n' else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 12

  act-runner:
    image: gitea/act_runner:0.2.11
    restart: unless-stopped
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    environment:
      GITEA_INSTANCE_URL: "http://gitea:3000"
      GITEA_RUNNER_NAME: "omcgitea-${PROFILE}-runner"
      # CI jobs run in the TASK's own agent image, not a generic node image, so
      # the toolchain and pinned dependency versions in CI are the grader's by
      # construction. The host daemon already has it locally (the agents run on
      # it), so there is no pull. Falls back to node for non-pbench use.
      GITEA_RUNNER_LABELS: "ubuntu-latest:docker://${AGENT_IMAGE:-node:20-bookworm}"
      # Job-container network. act_runner's default is to create one per job,
      # which (a) cannot resolve gitea:3000 so a job cannot clone the repo, and
      # (b) is a normal NATed bridge — a route to the internet straight through
      # the offline boundary this benchmark depends on. Pin it to the stack net.
      ACT_JOB_NETWORK: "${ACT_JOB_NETWORK:-omcgitea-${PROFILE}_default}"
      # act_runner defaults to capacity 1, which serialises every worker's build
      # behind every other worker's. But capacity is PER STACK, and a sweep runs
      # ~18 stacks at once: capacity 4 meant up to 72 concurrent job containers,
      # each unlimited. Sweep 6.6 took the host down with that. Keep it at 2.
      ACT_CAPACITY: "${ACT_CAPACITY:-2}"
      # Hard ceiling on a CI job container. Without this a job sees all 256 cores
      # and all 503 GB: `nproc` returns 256 inside it, so anything written as
      # `xargs -P $(nproc)` or `make -j$(nproc)` forks 256 processes, and ~18
      # stacks doing that simultaneously exhausted memory and PIDs until sshd
      # could no longer fork. --pids-limit is the load-bearing one.
      ACT_JOB_LIMITS: "${ACT_JOB_LIMITS:---memory=8g --memory-swap=8g --cpus=4 --pids-limit=512}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/tokens:/run/omcgitea/tokens:ro
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/act-runner:/data
    working_dir: /data
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        cat > /data/config.yaml <<EOF
        runner:
          capacity: $$ACT_CAPACITY
          # 5m, not the 3h default. A job that wedges on the docker daemon
          # ("RWLayer ... unexpectedly nil", "volume is in use") never fails on
          # its own: 7 of ~800 jobs in sweep 6.6 hung until the stack tore down,
          # one for 132 minutes, holding a worker's PR unmergeable the whole
          # time. The suite itself finishes in seconds once the counter is
          # parallel, so anything past 5 minutes is a wedge, not slow tests.
          timeout: $${ACT_JOB_TIMEOUT:-5m}
        container:
          network: "$$ACT_JOB_NETWORK"
          options: "$$ACT_JOB_LIMITS"
          valid_volumes: []
        EOF
        if [ ! -f /data/.runner ]; then
          tok=$$(cat /run/omcgitea/tokens/runner.token)
          /usr/local/bin/act_runner register --no-interactive \
            --instance "$$GITEA_INSTANCE_URL" --token "$$tok" \
            --name "$$GITEA_RUNNER_NAME" --labels "$$GITEA_RUNNER_LABELS"
        fi
        exec /usr/local/bin/act_runner daemon --config /data/config.yaml

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # innodb_use_native_aio=0: this host's fs.aio-max-nr is 65536 and ~53k of it
    # is permanently held by another project's containers, leaving too little
    # headroom for InnoDB's io_setup() -- it fails EAGAIN after 5 attempts, aborts
    # mid-initialize, and every restart then reports the misleading "data directory
    # has files in it" because the aborted run left auto.cnf behind. Disabling
    # native AIO is container-scoped: it touches nothing outside this project and
    # survives host reconciliation, unlike raising the sysctl. The board DB is
    # tiny, so buffered I/O costs nothing here.
    command: ["--innodb-use-native-aio=0"]
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD required}"
      MYSQL_DATABASE: omcgitea
      MYSQL_USER: omcgitea
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD required}"
    volumes:
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/mysql:/var/lib/mysql
      - ../mini-router/sql:/docker-entrypoint-initdb.d:ro
    expose: ["3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30

  mattermost:
    image: mattermost/mattermost-team-edition:10.6
    restart: unless-stopped
    environment:
      MM_SQLSETTINGS_DRIVERNAME: mysql
      MM_SQLSETTINGS_DATASOURCE: "omcgitea:${MYSQL_PASSWORD}@tcp(mysql:3306)/mattermost?charset=utf8mb4,utf8&readTimeout=30s&writeTimeout=30s"
      MM_SERVICESETTINGS_SITEURL: "${MATTERMOST_SITE_URL:-http://mattermost:8065}"
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"
      MM_TEAMSETTINGS_MAXUSERSPERTEAM: "200"
    depends_on:
      mysql: { condition: service_healthy }
    volumes:
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/mattermost/data:/mattermost/data
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/mattermost/logs:/mattermost/logs
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/mattermost/config:/mattermost/config
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/mattermost/plugins:/mattermost/plugins
    expose: ["8065"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8065/api/v4/system/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # === 37 agents (1 director + 1 auditor + 5 leads + 5 reviewers + 25 workers) ===

  hermes-agent-director:
    <<: *hermes-agent-base
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *hermes-env-base
      AGENT_NAME: "${ORG_NAME}-director"
      AGENT_ROLE: "director"
      GITEA_TOKEN_FILE: "/run/omcgitea/tokens/agent-${ORG_NAME}-director.token"
    volumes:
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/hermes/${ORG_NAME}-director:/opt/data
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/acp/${ORG_NAME}-director:/var/run/acp
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/tokens/agent-${ORG_NAME}-director.token:/run/omcgitea/tokens/agent-${ORG_NAME}-director.token:ro
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/tokens/agent-${ORG_NAME}-director-mm.token:/run/omcgitea/tokens/agent-${ORG_NAME}-director-mm.token:ro
      # pbench anti-reverse: reference binary mounted root:root 0111 (RUN-only, never readable).
      # Env-gated — dev/prod/other-org leave PBENCH_BIN unset → /dev/null (harmless no-op);
      # org-pbench sets PBENCH_BIN to the extracted 0111 binary on the host.
      - ${PBENCH_BIN:-/dev/null}:/opt/pbench/executable:ro

  hermes-agent-auditor:
    <<: *hermes-agent-base
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *hermes-env-base
      AGENT_NAME: "${ORG_NAME}-auditor"
      AGENT_ROLE: "auditor"
      GITEA_TOKEN_FILE: "/run/omcgitea/tokens/agent-${ORG_NAME}-auditor.token"
    volumes:
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/hermes/${ORG_NAME}-auditor:/opt/data
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/acp/${ORG_NAME}-auditor:/var/run/acp
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/tokens/agent-${ORG_NAME}-auditor.token:/run/omcgitea/tokens/agent-${ORG_NAME}-auditor.token:ro
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/tokens/agent-${ORG_NAME}-auditor-mm.token:/run/omcgitea/tokens/agent-${ORG_NAME}-auditor-mm.token:ro
      # pbench anti-reverse: reference binary mounted root:root 0111 (RUN-only, never readable).
      # Env-gated — dev/prod/other-org leave PBENCH_BIN unset → /dev/null (harmless no-op);
      # org-pbench sets PBENCH_BIN to the extracted 0111 binary on the host.
      - ${PBENCH_BIN:-/dev/null}:/opt/pbench/executable:ro

  hermes-agent-team1-lead:
    <<: *hermes-agent-base
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *hermes-env-base
      AGENT_NAME: "${ORG_NAME}-team1-lead"
      AGENT_ROLE: "lead"
      GITEA_TOKEN_FILE: "/run/omcgitea/tokens/agent-${ORG_NAME}-team1-lead.token"
    volumes:
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/hermes/${ORG_NAME}-team1-lead:/opt/data
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/acp/${ORG_NAME}-team1-lead:/var/run/acp
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/tokens/agent-${ORG_NAME}-team1-lead.token:/run/omcgitea/tokens/agent-${ORG_NAME}-team1-lead.token:ro
      - ${DATA_ROOT:-../.claude-team-data}/${PROFILE}/tokens/agent-${ORG_NAME}-team1-lead-mm.token:/run/omcgitea/tokens/agent-${ORG_NAME}-team1-lead-mm.token:ro
