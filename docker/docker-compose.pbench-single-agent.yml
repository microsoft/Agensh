# docker-compose.pbench-single-agent.yml — single-agent ProgramBench
# baseline, Copilot CLI + BYOK variant.
#
# Same anti-cheat topology as the team runs (internal-only default net + egress-proxy as the sole off-cluster hop + 0111 reference
# binary + uid 10000), but the cc container is a per-task omcgitea-single-agent
# image (docker/single-agent/Dockerfile) that FROMs the cleanroom and
# installs @github/copilot@1.0.70 at /opt/copilot-cli/node_modules/.bin/copilot.
#
# The Copilot ACP child is spawned per-turn from the host via
#   docker exec -i <cc> /opt/copilot-cli/node_modules/.bin/copilot \
#       --acp --stdio --no-auto-login --no-auto-update --no-remote \
#       --disable-builtin-mcps --no-ask-user
# with the driver (scripts/acp_driver.py) speaking JSON-RPC 2.0 over stdio.
# Same protocol as the Claude ACP variant; the driver is agent-agnostic.
#
# BYOK: COPILOT_PROVIDER_* env below points at the OpenAI-shape LLM endpoint
# (PBENCH_LLM_UPSTREAM, reached at /v1). See .env.pbench-single-agent.
# No GitHub identity is required or used — the CLI's usual login flow is bypassed
# via --no-auto-login and the environment variables that tell it to use the
# provider directly.

networks:
  # SUBNETS ARE PINNED, NOT AUTO-ALLOCATED — same reasoning as
  # docker-compose.pbench.yml (see 415eba3). Each stack takes two subnets and
  # docker's built-in pool holds only 31, so the ~12th concurrent stack dies
  # with "all predefined address pools have been fully subnetted" — and it dies
  # AFTER the runner's teardown trap is armed, so the task still exports an
  # empty submission that eval scores 0.00% with every test not_run, which is
  # indistinguishable from a genuine agent failure.
  #
  # daemon.json is not durable on this host (Ansible reverts it every 30 min
  # and restarts dockerd), so the subnets live here. 10.177.0.0/16 is free:
  # the host routes only 10.50.x and 10.209.224.0/21, and the multi-agent
  # overlay already claims 10.176.0.0/16.
  #
  # Callers set these per stack; the
  # fallbacks let a single unparameterised run come up unchanged.
  default:
    internal: true
    ipam:
      config:
        - subnet: ${PBENCH_SUBNET_DEFAULT:-10.177.253.0/24}
  # Normal bridge with outbound internet, attached ONLY to egress-proxy.
  egress:
    driver: bridge
    ipam:
      config:
        - subnet: ${PBENCH_SUBNET_EGRESS:-10.177.254.0/24}

services:
  egress-proxy:
    image: python:3.13-slim
    restart: unless-stopped
    networks:
      - default
      - egress
    environment:
      UPSTREAM: "${PBENCH_LLM_UPSTREAM:?PBENCH_LLM_UPSTREAM required (the real LLM endpoint)}"
      LISTEN_PORT: "4180"
      LISTEN_HOST: "0.0.0.0"
      PYTHONUNBUFFERED: "1"
      # Copilot CLI hardcodes claude-opus-4.7 / claude-sonnet-4.5 in --acp
      # mode; the sglang GLM gateway only knows its own model IDs. Rewrite the
      # JSON body's `model` field at the proxy so the request actually routes.
      # Defaults to the sglang gateway pool alias; env-override with a different
      # ANTHROPIC_MODEL to hit a specific shard.
      UPSTREAM_MODEL_OVERRIDE: "${ANTHROPIC_MODEL:-SGLANG-GATEWAY-GLM-5.2-FP8-All}"
      # Guarantee the configured model appears in GET /v1/models responses
      # even if the upstream transiently drops it from its catalog. Copilot's
      # session-init otherwise 404s and error-loops for the whole 6h. See
      # MODELS_ALLOWLIST_INJECT docs in strip_metadata_proxy.py.
      MODELS_ALLOWLIST_INJECT: "${ANTHROPIC_MODEL:-SGLANG-GATEWAY-GLM-5.2-FP8-All}"
    volumes:
      - ../scripts/strip_metadata_proxy.py:/opt/strip_metadata_proxy.py:ro
    command: ["python3", "/opt/strip_metadata_proxy.py"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket,sys; s=socket.socket(); s.settimeout(2); sys.exit(0 if s.connect_ex(('127.0.0.1',4180))==0 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 12

  cc-agent:
    # Built per-task from docker/single-agent/Dockerfile FROM the
    # task's cleanroom image — the running stack has no network, so the copilot binary MUST be baked
    # in host-side first.
    image: "${SINGLE_AGENT_IMAGE:?SINGLE_AGENT_IMAGE required (build docker/single-agent first)}"
    restart: "no"
    networks:
      - default
    # Non-root: 0111 reference binary is EXECUTABLE but not READABLE (anti-RE).
    user: "${ACP_CHILD_UID:-10000}:${ACP_CHILD_GID:-10000}"
    working_dir: /workspace
    environment:
      # --- ANTHROPIC_* are the source of truth on the driver side ---------
      # (matches the ACP variant so the driver script can be shared / cloned
      # with minimal diffs). We fan them out below into COPILOT_* / OPENAI_*
      # so the copilot binary can consume them.
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-http://egress-proxy:4180}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY required}"
      ANTHROPIC_AUTH_TOKEN: "${ANTHROPIC_AUTH_TOKEN:-${ANTHROPIC_API_KEY}}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:?ANTHROPIC_MODEL required (e.g. SGLANG-GATEWAY-GLM-5.2-FP8-All)}"
      # --- Copilot BYOK provider (mirrors docker/agent/entrypoint.sh's copilot branch)
      COPILOT_PROVIDER_TYPE: "${COPILOT_PROVIDER_TYPE:-openai}"
      COPILOT_PROVIDER_BASE_URL: "${COPILOT_PROVIDER_BASE_URL:-http://egress-proxy:4180/v1}"
      COPILOT_PROVIDER_API_KEY: "${COPILOT_PROVIDER_API_KEY:-${ANTHROPIC_API_KEY}}"
      COPILOT_MODEL: "${COPILOT_MODEL:-${ANTHROPIC_MODEL}}"
      # No value: set only when launch_single_agent.sh exports them from the
      # profile (gpt-5.6-sol needs responses). Unset, the container has neither.
      COPILOT_PROVIDER_WIRE_API:
      COPILOT_PROVIDER_MAX_PROMPT_TOKENS:
      # COPILOT_AGENT_MODEL is deliberately NOT set. On 1.0.70 under
      # COPILOT_ENABLE_ALT_PROVIDERS it is validated against GitHub's own
      # model catalog, so a BYOK id is rejected ("Check that the model is
      # available on your provider") and Copilot falls back to its built-in
      # default anyway. COPILOT_MODEL alone selects the BYOK model correctly.
      #
      # The failure mode is silent and expensive: Copilot swallows the 404 and
      # answers the ACP request with stopReason=end_turn, so acp_driver spins
      # on zero-token turns and the run exports an empty submission that eval
      # scores 0.00% with every test not_run.
      COPILOT_OFFLINE: "true"
      COPILOT_AUTO_UPDATE: "false"
      COPILOT_ENABLE_ALT_PROVIDERS: "true"
      # --- OpenAI-shape provider expects OPENAI_API_KEY when provider_type=openai
      OPENAI_API_KEY: "${OPENAI_API_KEY:-${ANTHROPIC_API_KEY}}"
      # --- HOME for copilot's ~/.copilot state (also gives non-root a place
      # to write). Point at the persisted bind mount so state survives teardown.
      HOME: /home/ccagent
      COPILOT_HOME: /home/ccagent/.copilot
    volumes:
      - "${PBENCH_SEED_DIR:?PBENCH_SEED_DIR required}:/workspace"
      - "${PBENCH_BIN:-/dev/null}:/opt/pbench/executable:ro"
      - "${PBENCH_CC_HOME:?PBENCH_CC_HOME required}:/home/ccagent"
    # Idle; scripts/acp_driver.py drives ACP via
    #   docker exec -i ... /opt/copilot-cli/node_modules/.bin/copilot --acp --stdio ...
    entrypoint: ["sleep", "infinity"]
