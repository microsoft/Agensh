# Gitea and Mattermost edge ports for the single-node stack.
# Agent/router services remain on the internal network.

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Allow Gitea git-over-http push of reasonably large refs.
    client_max_body_size 100m;

    # Default catch-all in conf.d/gitea.conf proxies any Host to Gitea.
    include /etc/nginx/conf.d/*.conf;
}
