# omcgitea nginx-edge — single public entrypoint.
#
# M2-A scope: ONLY exposes Gitea (Web UI + API).
# - the agent containers have no externally-reachable surface (no webhook server,
#   no health, no CLI). M2-E.1 retired the webhook path entirely; the
#   router consumes events via REST pull + SSE inside the docker network.
# - All other Host headers / paths return 444 (deny).

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Allow Gitea git-over-http push of reasonably large refs.
    client_max_body_size 100m;

    # Default catch-all in conf.d/gitea.conf proxies any Host to Gitea.
    include /etc/nginx/conf.d/*.conf;
}
