# mattermost — exposed on a separate edge port (EDGE_MM_PORT, default 28082).
# Only-public-IP setups can't do vhost-based routing on a single port without DNS,
# so we listen on a second port inside the nginx-edge container (81) and map it
# to EDGE_MM_PORT on the host.
#
# WebSocket (/api/v4/websocket) requires Upgrade/Connection headers.

server {
    listen 81 default_server;
    server_name _;

    location / {
        proxy_pass http://mattermost:8065;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
