# Expose Gitea through the profile's host port, including its long-lived SSE feed.
server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://gitea:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        # Flush event frames promptly instead of waiting for a response buffer to fill.
        proxy_buffering off;
        proxy_read_timeout 300s;

        # The driver pushes a whole imported history here, so Git pushes are not held to
        # nginx.conf's request limit; Gitea authenticates them before reading the pack.
        location ~ /git-receive-pack$ {
            client_max_body_size 0;
            proxy_pass http://gitea:3000;
        }
    }
}
