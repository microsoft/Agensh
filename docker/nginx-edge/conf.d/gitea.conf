# gitea.${EDGE_DOMAIN} → gitea:3000 (Web UI + API)
#
# Note: Gitea is configured with ROOT_URL=http://gitea:3000/ (internal name).
# Browsers see different URLs (gitea.<domain>); Gitea is generally fine with
# this for UI navigation, but generated URLs in webhook bodies / RSS / OAuth
# redirects may still reflect ROOT_URL. Adjust ROOT_URL if external links
# need to point at the public hostname.

server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://gitea:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
