# docker-compose.pbench.yml — ProgramBench egress-lock overlay.
#
# The Makefile layers it on every PROFILE=pbench-single-node-* stack. It adds two things
# on top of the rendered base
# (docker/_gen-prod.<profile>.yml from tools/gen-compose-prod.py):
#
#   1. Network lock: the project's default network becomes `internal: true`,
#      so Gitea / MySQL / Mattermost / agents / sidecars have ZERO route to
#      the public internet. This is the ProgramBench anti-cheat boundary —
#      an agent cannot `git clone` the original project's source from GitHub.
#      (The agent image ships no iptables, so we rely on docker's native
#      internal network rather than in-container firewalling.)
#
#   2. egress-proxy: the ONLY way off-cluster. A dual-homed container on both
#      the locked default net and a normal `egress` bridge. It runs our
#      scripts/strip_metadata_proxy.py, forwarding agent LLM traffic to the
#      real LLM VM (PBENCH_LLM_UPSTREAM). Agents point ANTHROPIC_BASE_URL at
#      http://egress-proxy:4180 (see .env.pbench-*), so the ONLY public host
#      the whole cluster can reach is the LLM VM, through this single hop.
#
# The lock is an overlay rather than generator output so it stays in one
# reviewable file, separate from the per-profile rendered base.

networks:
  # Override the project's implicit default network to be internal (no NAT to
  # the host / outside world). Every service that doesn't declare its own
  # networks inherits this, so the entire cluster is sealed.
  #
  # SUBNETS ARE PINNED, NOT AUTO-ALLOCATED.
  # Each stack needs three networks, and docker's built-in address pool
  # (172.17.0.0/12 in /16s + 192.168.0.0/16 in /20s) holds only 31 — so the
  # 10th concurrent stack fails `make up` with "all predefined address pools
  # have been fully subnetted". That failure is dangerous rather than merely
  # inconvenient: it lands after the run script's teardown trap is armed, so
  # the chain still exports an empty submission and eval records a plausible
  # 0.00% with every test not_run.
  #
  # The daemon-side fix (default-address-pools in /etc/docker/daemon.json) does
  # not survive here: Ansible runs every 30 minutes, reverts daemon.json and
  # restarts dockerd — which kills every live stack mid-run. Only repo-owned
  # configuration is durable on this host, so the subnets live here.
  #
  # Generated profiles use 10.216.x ranges; check for conflicts with host routes
  # when deploying on another machine.
  # Concurrent stacks set these per profile (see scripts/pbench_gen_env.sh); the
  # fallbacks let an unparameterised single-profile run come up unchanged.
  default:
    internal: true
    ipam:
      config:
        - subnet: ${PBENCH_SUBNET_DEFAULT:-10.176.253.0/24}
  # A normal bridge with outbound internet, attached ONLY to egress-proxy.
  egress:
    driver: bridge
    ipam:
      config:
        - subnet: ${PBENCH_SUBNET_EGRESS:-10.176.254.0/24}
  # A normal bridge for host<->edge port publishing. An `internal: true` network
  # has no host gateway, so a container sitting ONLY on it cannot have its
  # published ports (EDGE_HTTP_PORT:80) forwarded from the host. nginx-edge must
  # be reachable from the host (seed push / issue / submission export all hit
  # http://localhost:EDGE_HTTP_PORT), so we dual-home ONLY nginx-edge here.
  # Agents/gitea/etc. stay sealed on the internal default net → anti-cheat holds.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${PBENCH_SUBNET_EDGE:-10.176.255.0/24}

services:
  # Dual-home the edge proxy: `default` (internal) to reach gitea/mattermost,
  # `edge` (bridge) so the host can actually reach its published ports.
  nginx-edge:
    networks:
      - default
      - edge
    # Public access: optionally expose Gitea (nginx :80 default_server →
    # gitea:3000) on a host port the Azure NSG allows from the internet.
    # Parameterized for multi-instance colocation (each pbench task gets its own
    # PBENCH_PUBLIC_PORT) and DEFAULTS TO DISABLED (empty → compose binds an
    # ephemeral host port that nothing routes to, so no public exposure unless
    # PBENCH_PUBLIC_PORT is set in the instance .env). Appended to the base
    # EDGE_HTTP_PORT/EDGE_MM_PORT mappings (compose merges `ports` additively).
    # Results are normally read via localhost:EDGE_HTTP_PORT or an ssh tunnel.
    ports:
      - "${PBENCH_PUBLIC_PORT:-}:80"

  egress-proxy:
    image: python:3.13-slim
    restart: unless-stopped
    cgroup_parent: pbench.slice
    networks:
      - default   # reachable from agents on the sealed internal net
      - egress    # the single hop that actually has internet
    environment:
      UPSTREAM: "${PBENCH_LLM_UPSTREAM:?PBENCH_LLM_UPSTREAM required (the real LLM VM)}"
      LISTEN_PORT: "4180"
      # Bind all interfaces: agents reach this as a SEPARATE container via
      # egress-proxy:4180 (dev/prod run the proxy as a 127.0.0.1 sidecar, so the
      # script default stays localhost-only — only pbench overrides it here).
      LISTEN_HOST: "0.0.0.0"
      # Optional Bearer-auth injection for upstreams that require
      # `Authorization: Bearer <token>` (Azure FrontDoor / OpenRouter / etc).
      # Empty by default → proxy is header-transparent.
      # When set (e.g. via .env.pbench-*), the proxy replaces any
      # inbound Authorization / x-api-key with a single Bearer header.
      UPSTREAM_AUTH_TOKEN: "${UPSTREAM_AUTH_TOKEN:-}"
      # Auth header style. "bearer" (default) sends `Authorization: Bearer …`;
      # "api-key" sends `api-key: …` (Azure AI Foundry `services.ai.azure.com`
      # /models endpoint expects this).
      UPSTREAM_AUTH_STYLE: "${UPSTREAM_AUTH_STYLE:-bearer}"
      # Absorb transient gateway 5xx here rather than letting them kill an
      # agent turn. The agent SDK gives up after 5 tries in SIX SECONDS total,
      # and a dead turn leaves an event-driven agent idle until something else
      # happens to wake it.
      UPSTREAM_RETRY_ATTEMPTS: "${UPSTREAM_RETRY_ATTEMPTS:-4}"
    volumes:
      - ../scripts/strip_metadata_proxy.py:/opt/strip_metadata_proxy.py:ro
    command: ["python3", "/opt/strip_metadata_proxy.py"]
    healthcheck:
      # The proxy answers any path; hitting it proves the listener is up.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:4180/healthz', timeout=2); sys.exit(0)\" 2>/dev/null || python3 -c \"import socket,sys; s=socket.socket(); s.settimeout(2); sys.exit(0 if s.connect_ex(('127.0.0.1',4180))==0 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12


  # --- mysql healthcheck tolerance ------------------------------------------
  # Under docker-daemon pressure (e.g. sibling pbench stacks racing `make up`),
  # mysql:8.4 cold start (initdb + /docker-entrypoint-initdb.d scripts + first
  # schema load) can exceed the default 30 × 5s = 150s window, causing every
  # `depends_on: {mysql: {condition: service_healthy}}` service (Gitea,
  # Mattermost, bootstrap) to abort with "dependency mysql failed to start ...
  # is unhealthy" and take the whole `make up` down with it.
  #
  # start_period: 300s gives mysql a full 5 minutes to become healthy without
  # any failing probe counting against `retries`. Once mysql answers ping
  # once, subsequent probes are on the 5s cadence.
  mysql:
    healthcheck:
      # --protocol=TCP is load-bearing, not a tidy-up. The default `mysqladmin
      # ping` connects over the UNIX SOCKET, and mysql:8.4's entrypoint runs a
      # TEMPORARY socket-only server during initdb -- so the probe passes while
      # port 3306 is still refusing connections. Compose then declares mysql
      # healthy and starts mattermost, whose DB retry budget is finite: it logs
      # "dial tcp <ip>:3306: connect: connection refused", exhausts its retries,
      # and HANGS -- alive, never serving, never logging again. `make up` then
      # fails with "dependency mattermost failed to start" and takes the run
      # with it.
      #
      # Fast local storage hides this because initdb finishes inside
      # mattermost's budget. On slow or full storage mattermost is already
      # failing to connect before mysqld accepts TCP, and never recovers.
      #
      # Probing TCP means the healthy signal means what every dependent
      # actually needs: the port is open.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 --protocol=TCP -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 300s
