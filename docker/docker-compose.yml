      hermes-agent-hermes8: { condition: service_started }
    environment:
      <<: *mini-router-env-base
      ACP_SESSION_NAMESPACE: "hermes"
      AGENT_NAME: "hermes8"
      GITEA_PASSWORD_FILE: "/run/omcgitea/tokens/agent-hermes8.password"
    volumes:
      - ../.claude-team-data/${PROFILE:-dev}/acp/hermes8:/var/run/acp:ro
      - ../.claude-team-data/${PROFILE:-dev}/tokens/agent-hermes8.password:/run/omcgitea/tokens/agent-hermes8.password:ro
    expose: ["8645"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8645/healthz >/dev/null 2>&1 || exit 1"]
