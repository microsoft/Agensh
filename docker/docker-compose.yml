  # =========================================================================
  # R7 SIDECAR: mini-router-<agent>. One per hermes-agent service.
  # Each shares the agent's ACP unix socket (read-only mount), reads its
  # own token via secret-service, persists events to the shared MySQL.
  # =========================================================================

  mini-router-1:
    <<: *mini-router-base
    profiles: ["dev"]
    build:
      context: ../mini-router
    depends_on:
      mysql: { condition: service_healthy }
      secret-service: { condition: service_healthy }
      hermes-agent-1: { condition: service_started }
    environment:
      <<: *mini-router-env-base
      AGENT_NAME: "agent1"
      GITEA_PASSWORD_FILE: "/run/omcgitea/tokens/agent-agent1.password"
    volumes:
      - ../.claude-team-data/${PROFILE:-dev}/acp/agent1:/var/run/acp:ro
      - ../.claude-team-data/${PROFILE:-dev}/tokens/agent-agent1.password:/run/omcgitea/tokens/agent-agent1.password:ro
    expose: ["8645"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8645/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

